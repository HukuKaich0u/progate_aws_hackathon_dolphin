[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolphin-python-api"
version = "0.1.0"
description = "FastAPI backend for the Dolphin hackathon project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.116.0,<0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<0.29.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
