services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-3000}
      RUST_LOG: ${RUST_LOG:-info,backend=debug}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/app}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      CHIME_MEDIA_REGION: ${CHIME_MEDIA_REGION:-ap-northeast-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-ap-northeast-1_example}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-exampleclientid}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
